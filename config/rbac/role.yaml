---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - checks.zonecheck.dev
  resources:
  - zonechecks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - checks.zonecheck.dev
  resources:
  - zonechecks/finalizers
  verbs:
  - update
- apiGroups:
  - checks.zonecheck.dev
  resources:
  - zonechecks/status
  verbs:
  - get
  - patch
  - update
