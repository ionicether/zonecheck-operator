---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - checks.zonecheck.dev
  resources:
  - zonechecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - checks.zonecheck.dev
  resources:
  - zonechecks/status
  verbs:
  - get
  - patch
  - update
